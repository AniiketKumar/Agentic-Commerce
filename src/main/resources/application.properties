spring.application.name=firstSpringApplication

## H2 (in-memory for now, swapped for Postgres in Phase 4)
#spring.datasource.url=jdbc:h2:mem:marketplace
#spring.datasource.driver-class-name=org.h2.Driver
#spring.datasource.username=sa
#spring.datasource.password=

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/marketplace
spring.datasource.username=postgres
spring.datasource.password=postgres


# lets you inspect the DB in a browser at /h2-console while the app runs
spring.h2.console.enabled=true
# no use of the above line now that we have postgres setup

# create-drop is fine for now; revisit once we care about data surviving a restart
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

#Json web token stuff
jwt.secret=this-is-a-temporary-dev-secret-key-replace-me-before-any-real-deploy
jwt.expiration-ms=86400000

#actuator for health/metrics for observability
management.endpoints.web.exposure.include = health,metrics,info
management.endpoint.health.show-details=when-authorized